<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintage Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desighn.css" />
</head>
<body class="dark-theme">
  <div class="lace-border-top"></div>

  <div class="app-container">
    
    <header class="header">
      <div class="header__brand">
        <h1 class="header__title" id="pageTitle">My shelves</h1>
        <p class="header__subtitle">Vintage Edition</p>
      </div>
      <div class="header__actions">
        <input type="text" id="searchInput" placeholder="Search book, author..." class="header__search-input" />
        <button id="addBookBtn" class="btn btn--primary">+ Add Book</button>
      </div>
    </header>

    
    <section id="tab-calendar" class="tab-content hidden">
      <div class="lace-card calendar-wrapper">
        <div class="calendar-header">
          <button id="prevMonthBtn" class="btn-icon">&lt;</button>
          <h2 id="currentMonthYear" class="calendar-title">September 2026</h2>
          <button id="nextMonthBtn" class="btn-icon">&gt;</button>
        </div>
        <div class="calendar-grid-header">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div id="calendarDays" class="calendar-grid"></div>
      </div>
    </section>

    
    <section id="tab-library" class="tab-content active">
      <div class="controls-section">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="reading">Reading</button>
          <button class="filter-tab" data-filter="planned">To Read</button>
          <button class="filter-tab" data-filter="read">Completed</button>
        </div>
        <select id="sortSelect" class="sort-select custom-input">
          <option value="title">By Title</option>
          <option value="author">By Author</option>
          <option value="progress">By Progress</option>
        </select>
      </div>
      <main id="booksGrid" class="books-grid"></main>
    </section>

    
    <section id="tab-series" class="tab-content hidden">
      <div class="series-controls">
        <input type="text" id="newSeriesInput" placeholder="New series name..." class="custom-input" />
        <button id="addSeriesBtn" class="btn btn--primary">+ Create Series</button>
      </div>
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    
    <section id="tab-stats" class="tab-content hidden">
      <div class="stats-grid">
        <div class="stat-card lace-card">
          <span class="stat-card__label">TOTAL BOOKS</span>
          <span id="statTotal" class="stat-card__value">0</span>
        </div>
        <div class="stat-card lace-card">
          <span class="stat-card__label">IN PROGRESS</span>
          <span id="statReading" class="stat-card__value">0</span>
        </div>
        <div class="stat-card lace-card">
          <span class="stat-card__label">COMPLETED</span>
          <span id="statRead" class="stat-card__value">0</span>
        </div>
        <div class="stat-card lace-card">
          <span class="stat-card__label">PAGES READ</span>
          <span id="statPages" class="stat-card__value">0</span>
        </div>
      </div>
    </section>

    
    <section id="tab-profile" class="tab-content hidden">
      <div class="profile-container lace-card">
        <div class="profile-header">
          <div class="avatar-wrapper">
            <img id="profileAvatar" src="https://ui-avatars.com/api/?name=Mahinbonu&background=2a2a2a&color=fff&size=120" alt="Avatar" />
            <label for="avatarUpload" class="avatar-upload-btn">📷</label>
            <input type="file" id="avatarUpload" accept="image/*" class="hidden" />
          </div>
          <div class="profile-info">
            <h2 id="profileNameDisplay">User</h2>
            <p id="profileBioDisplay">Book lover & aesthetic lover</p>
          </div>
        </div>

        <hr class="divider" />

        <div class="profile-settings">
          <h3>Profile Settings</h3>
          <div class="form-group">
            <label for="profileNameInput">Your Name</label>
            <input type="text" id="profileNameInput" class="custom-input" value="User" />
          </div>

          <div class="form-group">
            <label>Theme</label>
            <div class="theme-toggle-group">
              <button id="darkThemeBtn" class="btn btn--secondary active-theme">🌙 Dark</button>
              <button id="lightThemeBtn" class="btn btn--secondary">☀️ Light</button>
            </div>
          </div>

          <button id="saveProfileBtn" class="btn btn--primary" style="width: 100%; margin-top: 1rem;">Save Changes</button>
        </div>
      </div>
    </section>
  </div>

 
  <nav class="bottom-nav">
    <button class="nav-item" data-tab="calendar">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Calendar</span>
    </button>
    <button class="nav-item active" data-tab="library">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Library</span>
    </button>
    <button class="nav-item" data-tab="series">
      <span class="nav-icon">🔖</span>
      <span class="nav-label">Series</span>
    </button>
    <button class="nav-item" data-tab="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Stats</span>
    </button>
    <button class="nav-item" data-tab="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </button>
  </nav>

  
 <div id="bookModal" class="modal-overlay hidden">
  <div class="modal lace-card">
    <div class="modal__header">
      <h2>Add Book</h2>
      <button type="button" class="modal__close-btn" id="closeModalBtn">&times;</button>
    </div>

    <form id="addBookForm">
      
      <div class="form-group text-center">
        <label>Book Cover</label>
        <input type="file" id="bookCoverInput" accept="image/*" class="file-input" />
      </div>

      
      <div class="form-group">
        <label for="bookTitle">Title *</label>
        <input type="text" id="bookTitle" class="custom-input" placeholder="Add..." required />
      </div>

     
      <div class="form-group">
        <label for="bookAuthor">Author *</label>
        <input type="text" id="bookAuthor" class="custom-input" placeholder="Add..." required />
      </div>

      
      <div class="form-group">
        <label>Format</label>
        <div class="format-options">
          <label class="format-btn">
            <input type="radio" name="format" value="eBook" checked />
            <span>📱 eBook</span>
          </label>
          <label class="format-btn">
            <input type="radio" name="format" value="Audiobook" />
            <span>🎧 Audiobook</span>
          </label>
          <label class="format-btn">
            <input type="radio" name="format" value="Print" />
            <span>📖 Print</span>
          </label>
        </div>
      </div>

      
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" class="custom-input" />
      </div>

      
      <div class="form-group">
        <label for="finishDate">Finish Date</label>
        <input type="date" id="finishDate" class="custom-input" />
      </div>

      
      <div class="form-group">
        <label for="bookStatus">Bookshelf</label>
        <select id="bookStatus" class="custom-input">
          <option value="Want to read">Want to read</option>
          <option value="Reading">Reading</option>
          <option value="Read">Read</option>
        </select>
      </div>

      
      <div class="form-group">
        <label for="bookDescription">Description</label>
        <textarea id="bookDescription" class="custom-input textarea-input" rows="3" placeholder="Add..."></textarea>
      </div>

      
      <!-- Genre -->
      <div class="form-group">
        <label for="bookGenreSelect">Genre *</label>
        <select id="bookGenreSelect" class="custom-input" required>
          <option value="Fiction">Fiction</option>
          <option value="Romance">Romance</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Classics">Classics</option>
          <option value="Non-Fiction">Non-Fiction</option>
          <option value="custom">+ Custom Genre</option>
        </select>

        <!-- Поле для ввода своего жанра -->
        <input 
          type="text" 
          id="customGenreInput" 
          class="custom-input hidden" 
          placeholder="Enter custom genre..." 
          style="margin-top: 0.5rem;" 
        />
      </div>

      
      <div class="form-group">
        <label for="bookPublisher">Publisher</label>
        <input type="text" id="bookPublisher" class="custom-input" placeholder="Add..." />
      </div>

      
      <div class="form-group">
        <label for="publicationYear">Publication Year</label>
        <input type="number" id="publicationYear" class="custom-input" placeholder="Add..." />
      </div>

      
      <div class="form-group">
        <label for="totalPages">Page Count</label>
        <input type="number" id="totalPages" class="custom-input" placeholder="Add..." />
      </div>

      <div class="modal__actions">
        <button type="submit" class="btn btn--primary btn--full">Save</button>
      </div>
    </form>
  </div>
</div>

  <script type="module" src="click.js"></script>
</body>
</html>
